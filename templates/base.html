<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}RPATech CRM{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='app.css') }}" rel="stylesheet">
</head>
<body>
  {% if g.user %}<nav class="navbar navbar-expand-lg app-nav"><div class="container"><a class="navbar-brand" href="{{ url_for('dashboard') }}"><i class="bi bi-grid-1x2-fill"></i> RPATech CRM</a><div class="d-flex align-items-center gap-3"><a href="{{ url_for('companies') }}" class="nav-link">Companies</a><a href="{{ url_for('contacts') }}" class="nav-link">Contacts</a><span class="user-chip"><i class="bi bi-person-circle"></i> {{ g.user['name'] }}</span><form method="post" action="{{ url_for('logout') }}"><button class="btn btn-sm btn-outline-light">Sign out</button></form></div></div></nav>{% endif %}
  <main class="container py-4">{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body></html>
